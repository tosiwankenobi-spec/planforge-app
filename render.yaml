# One-click deploy on Render: https://render.com/docs/blueprint-spec
# In the Render dashboard: New → Blueprint → point at this repo/folder.
# Render provisions the Postgres database and wires DATABASE_URL automatically.
# You still need to fill in (in the Render dashboard, under this service's Environment):
#   ENCRYPTION_KEY   → run `openssl rand -hex 32` locally, paste the result
#   ALLOWED_ORIGINS  → your hosted app's origin(s), comma-separated
#   SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / MAIL_FROM → your email provider
# JWT_SECRET is generated for you automatically.

databases:
  - name: planforge-db
    plan: free

services:
  - type: web
    name: planforge-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: planforge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
